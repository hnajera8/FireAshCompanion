name: Build Fire Ash Companion APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q FireAshCompanion_OCR.zip -d project

          PROJECT_DIR=$(find project -name settings.gradle -type f -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No se encontró settings.gradle"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Use Android SDK 35
        run: |
          sed -i 's/compileSdk 37/compileSdk 35/' "$PROJECT_DIR/app/build.gradle"

      - name: Configure AndroidX
        run: |
          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FireAshCompanion-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
