name: Build Fire Ash Companion APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q FireAshCompanion_OCR.zip -d project

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix project Gradle version
        working-directory: project/FireAshCompanion_phonebuild
        run: |
          sed -i "s/version '9.4.0'/version '8.7.3'/" ../FireAshCompanion_phonebuild/build.gradle

      - name: Build APK
        working-directory: project/FireAshCompanion_phonebuild
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FireAshCompanion-APK
          path: project/FireAshCompanion_phonebuild/app/build/outputs/apk/debug/app-debug.apk
